[package]
name = "configdiff"
version = "0.1.0"
edition = "2021"
authors = ["Juan Castiñeira <juancastingo@gmail.com>"]
description = "Fast, semantic configuration file diff tool supporting .env, JSON, YAML, and TOML with automatic secret redaction and CI exit codes."
repository = "https://github.com/juancastingo/configdiff"
homepage = "https://github.com/juancastingo/configdiff"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["config", "diff", "env", "yaml", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
colored = "2.1"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
